<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="가계부">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>가계부</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8a8a8e;--line:#e3e3e8;--fill:#e9e9ee;--accent:#007aff;--green:#34c759;--orange:#ff9500;--red:#ff3b30;--bar:rgba(242,242,247,.9)}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--line:#38383a;--fill:#2c2c2e;--accent:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--bar:rgba(22,22,24,.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
[data-act]{cursor:pointer}
.item,.chip,.tab,.ptitle{-webkit-user-select:none;user-select:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 8px 8px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--line)}
.nav{width:48px;height:44px;font-size:30px;color:var(--accent)}
.ptitle{display:flex;flex-direction:column;align-items:center}
.ptitle b{font-size:17px}
.ptitle small{font-size:12px;color:var(--sub)}
main{padding:12px 16px}
h3{font-size:13px;font-weight:600;color:var(--sub);margin:22px 4px 6px}
.card{background:var(--card);border-radius:12px;padding:14px 16px}
.list{padding:0}
.item{display:block;width:100%;text-align:left;padding:12px 16px;border-bottom:.5px solid var(--line)}
.item:last-child{border-bottom:0}
.item.link{color:var(--accent)}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.sub{color:var(--sub)}
.sm{font-size:12px}
.foot{font-size:12px;color:var(--sub);margin:6px 4px 0;line-height:1.5}
.big{font-size:26px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;border-radius:3px}
.ubar{position:relative;height:10px;border-radius:5px;background:var(--fill);margin:9px 0}
.ubar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.ubar b{position:absolute;left:83.333%;top:-3px;bottom:-3px;border-left:1.5px dashed var(--red);opacity:.75}
.stats{margin:4px 0 8px}
.stats>div{flex:1}
.name{font-weight:500}
.badge{font-size:11px;font-weight:700;padding:1px 6px;border-radius:8px;margin-left:6px}
.badge.caution{color:var(--orange);background:rgba(255,149,0,.15)}
.badge.over{color:var(--red);background:rgba(255,59,48,.15)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--sub);margin:8px 4px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:4px}
textarea.note{width:100%;border:0;background:transparent;resize:none;outline:none;display:block;padding:0;min-height:24px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:7px 13px;border-radius:16px;background:var(--fill);font-size:14px;white-space:nowrap}
.chip.on{background:var(--accent);color:#fff}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);margin:18px 4px 6px}
.exp{display:flex;align-items:center;gap:10px}
.tag{flex:none;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--fill)}
.memo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{flex:none;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:40px 0}
#fab{position:fixed;right:18px;bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:28px;background:var(--accent);color:#fff;font-size:32px;line-height:54px;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:15}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:.5px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;padding:6px 0 4px;font-size:11px;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:1px}
.tab span{font-size:20px;filter:grayscale(1);opacity:.55}
.tab.on{color:var(--accent)}
.tab.on span{filter:none;opacity:1}
.field{padding:12px 16px}
select{background:transparent;border:0;color:var(--accent);text-align:right}
.cname2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tools{display:flex;gap:4px;flex:none}
.tools button{padding:6px 8px;border-radius:8px;background:var(--fill);font-size:13px}
.tools button:disabled{opacity:.3}
.danger{color:var(--red)!important}
.addrow{display:flex;gap:8px;padding:10px 16px}
.addrow input{flex:1;border:0;background:transparent;outline:none;min-width:0}
.btn{color:var(--accent);font-weight:600}
.banner{margin:12px 16px 0;padding:12px 14px;border-radius:12px;background:rgba(0,122,255,.12);font-size:14px;line-height:1.5}
#overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35)}
.sheet{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 10px);bottom:0;background:var(--bg);border-radius:14px 14px 0 0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
.sheet-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--bg)}
.sheet-head button{color:var(--accent);min-width:56px;text-align:left}
.sheet-head .strong{font-weight:600;text-align:right}
#sheetBody{padding:0 16px}
.lbl{display:block;font-size:13px;color:var(--sub);margin:18px 4px 6px}
.amount{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:12px;padding:12px 16px}
.amount input{flex:1;border:0;background:transparent;outline:none;font-size:26px;font-weight:600;min-width:0}
.text{width:100%;border:0;background:var(--card);border-radius:12px;padding:12px 16px;outline:none;-webkit-appearance:none;appearance:none;display:block}
input[type=date].text{min-height:46px}
textarea.text{min-height:240px;resize:vertical}
.danger-btn{width:100%;margin-top:28px;padding:14px;border-radius:12px;background:var(--card);color:var(--red)}
</style>
</head>
<body>
<header>
  <button class="nav" data-act="prev" aria-label="이전 달">‹</button>
  <div class="ptitle" data-act="today"><b id="ptitle"></b><small id="prange"></small></div>
  <button class="nav" data-act="next" aria-label="다음 달">›</button>
</header>
<div id="install" class="banner" hidden>📌 <b>홈 화면에 추가해서 쓰세요.</b><br>주소창 옆 ··· → 공유 → '홈 화면에 추가' (안 보이면 '더 보기'). 기록은 꼭 홈 화면 아이콘으로 열어서 해 주세요. 사파리에서 연 것과 저장 공간이 따로예요.</div>
<main>
  <section id="view-budget" class="view"></section>
  <section id="view-history" class="view" hidden></section>
  <section id="view-settings" class="view" hidden></section>
</main>
<button id="fab" data-act="add" aria-label="지출 추가">+</button>
<nav class="tabs">
  <button class="tab on" data-act="tab" data-tab="budget"><span>📊</span>가계부</button>
  <button class="tab" data-act="tab" data-tab="history"><span>🧾</span>내역</button>
  <button class="tab" data-act="tab" data-tab="settings"><span>⚙️</span>설정</button>
</nav>
<div id="overlay" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <button data-act="close">취소</button>
      <b id="sheetTitle"></b>
      <button data-act="sheetSave" class="strong" id="sheetSave">저장</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json,.csv,.txt,application/json,text/csv,text/plain" hidden>

<script>
'use strict';
const KEY = 'gagyebu-v1';
const DEFAULT_CATS = ['저축', '주거비', '고정지출', '유지비', '교통비', '식비', '쇼핑', '여가비', '기타'];
const COLOR = { ok: 'var(--green)', caution: 'var(--orange)', over: 'var(--red)' };
const LABEL = { ok: '여유', caution: '주의', over: '초과' };
const BAR_MAX = 1.2; // 막대 오른쪽 끝 = 120%, 점선 = 100%
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const won = n => n.toLocaleString('ko-KR') + '원';
const toInt = s => { const d = String(s ?? '').replace(/\D/g, '').slice(0, 12); return d ? Number(d) : 0; };
const clampDay = n => { n = Math.round(Number(n)); return n >= 1 && n <= 28 ? n : 25; };
let seq = 0;
const uid = () => Date.now().toString(36) + (seq++).toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- 날짜 · 기간 (25일 시작이면 10/25~11/24 = 11월) ---------- */
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const today = () => { const t = new Date(); return ymd(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
const parts = s => { const [y, m, d] = s.split('-').map(Number); return { y, m, d }; };
const shift = (p, n) => { const t = p.y * 12 + (p.m - 1) + n; return { y: Math.floor(t / 12), m: t % 12 + 1 }; };
const pkey = p => p.y * 100 + p.m;
function periodOf(s, sd) { const { y, m, d } = parts(s); return sd > 1 && d >= sd ? shift({ y, m }, 1) : { y, m }; }
function rangeText(p, sd) {
  if (sd === 1) return `${p.m}/1 ~ ${p.m}/${new Date(p.y, p.m, 0).getDate()}`;
  const q = shift(p, -1);
  return `${q.m}/${sd} ~ ${p.m}/${sd - 1}`;
}
function dayLabel(s) { const { y, m, d } = parts(s); return `${m}월 ${d}일 (${'일월화수목금토'[new Date(y, m - 1, d).getDay()]})`; }

/* ---------- 데이터 ---------- */
function fresh() {
  return { version: 1, startDay: 25, categories: DEFAULT_CATS.map(name => ({ id: uid(), name, budgets: {} })), expenses: [], notes: {} };
}
function normalize(s) {
  const cats = (Array.isArray(s.categories) ? s.categories : []).map(c => ({
    id: String(c.id), name: String(c.name), budgets: (c.budgets && typeof c.budgets === 'object') ? c.budgets : {}
  }));
  const ids = new Set(cats.map(c => c.id));
  const exps = (Array.isArray(s.expenses) ? s.expenses : [])
    .filter(e => e && /^\d{4}-\d{2}-\d{2}$/.test(e.date) && ids.has(String(e.catId)))
    .map(e => ({ id: String(e.id || uid()), date: e.date, catId: String(e.catId), memo: String(e.memo || ''), amount: toInt(e.amount), created: Number(e.created) || 0 }));
  return { version: 1, startDay: clampDay(s.startDay), categories: cats, expenses: exps, notes: (s.notes && typeof s.notes === 'object') ? s.notes : {} };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const s = JSON.parse(raw); if (s && Array.isArray(s.categories)) return normalize(s); }
  } catch (e) {}
  return fresh();
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch (e) { alert('저장하지 못했어요. 저장 공간이 부족할 수 있어요. 백업부터 해 주세요.'); }
}
let state = load();
let ui = { tab: 'budget', period: periodOf(today(), state.startDay), filter: null };
let edit = null;

/* 그 달에 적용되는 예산 = 그 달까지 마지막으로 정한 금액 */
function budgetOf(c, k) {
  const keys = Object.keys(c.budgets).map(Number).filter(n => !isNaN(n)).sort((a, b) => a - b);
  if (!keys.length) return 0;
  let pick = keys[0];
  for (const x of keys) if (x <= k) pick = x;
  return toInt(c.budgets[pick]);
}
function usage(budget, spent) {
  const rate = budget > 0 ? spent / budget : (spent > 0 ? Infinity : 0);
  const status = rate > 1 ? 'over' : rate >= 0.8 ? 'caution' : 'ok';
  return { budget, spent, remaining: budget - spent, rate, status, rateText: isFinite(rate) ? Math.round(rate * 100) + '%' : '예산 없음' };
}
function expensesIn(p) {
  const k = pkey(p), sd = state.startDay;
  return state.expenses.filter(e => pkey(periodOf(e.date, sd)) === k);
}
const bar = u => `<div class="bar"><i style="width:${Math.min(isFinite(u.rate) ? u.rate : 1, 1) * 100}%;background:${COLOR[u.status]}"></i></div>`;
const autoGrow = el => { if (!el) return; el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

/* ---------- 화면 ---------- */
function render() {
  $('#ptitle').textContent = `${ui.period.y}년 ${ui.period.m}월`;
  $('#prange').textContent = rangeText(ui.period, state.startDay);
  document.querySelectorAll('.view').forEach(v => { v.hidden = v.id !== 'view-' + ui.tab; });
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === ui.tab));
  $('#fab').hidden = ui.tab === 'settings';
  if (ui.tab === 'budget') renderBudget();
  else if (ui.tab === 'history') renderHistory();
  else renderSettings();
}

function budgetRow({ c, u }) {
  const badge = u.status === 'ok' ? '' : `<span class="badge ${u.status}">${LABEL[u.status]}</span>`;
  const right = u.remaining >= 0 ? `남음 ${won(u.remaining)}` : `<span style="color:var(--red)">${won(-u.remaining)} 초과</span>`;
  const w = Math.min(isFinite(u.rate) ? u.rate : BAR_MAX, BAR_MAX) / BAR_MAX * 100;
  return `<div class="item" data-act="budget" data-id="${c.id}">
    <div class="row between"><span class="name">${esc(c.name)}${badge}</span><span class="num" style="color:${COLOR[u.status]};font-weight:600">${u.rateText}</span></div>
    <div class="ubar"><i style="width:${w}%;background:${COLOR[u.status]}"></i><b></b></div>
    <div class="row between sub sm num"><span>${won(u.spent)} / ${won(u.budget)}</span><span>${right}</span></div>
  </div>`;
}
function renderBudget() {
  const k = pkey(ui.period), list = expensesIn(ui.period), spent = {};
  list.forEach(e => { spent[e.catId] = (spent[e.catId] || 0) + e.amount; });
  const rows = state.categories.map(c => ({ c, u: usage(budgetOf(c, k), spent[c.id] || 0) }));
  const t = usage(rows.reduce((a, r) => a + r.u.budget, 0), rows.reduce((a, r) => a + r.u.spent, 0));
  const welcome = state.expenses.length ? '' : `<div class="card" style="margin-bottom:12px"><b>처음이세요?</b><div class="sub sm" style="margin-top:4px">설정 탭 → '붙여넣어서 불러오기'로 기존 데이터를 넣거나, 아래 항목을 눌러 예산을 정하고 + 버튼으로 지출을 적어 보세요.</div></div>`;
  $('#view-budget').innerHTML = `${welcome}
    <div class="card">
      <div class="row between"><span class="sub">남은 금액</span><span class="big num" style="${t.remaining < 0 ? 'color:var(--red)' : ''}">${won(t.remaining)}</span></div>
      ${bar(t)}
      <div class="row stats">
        <div><div class="sub sm">예산</div><div class="num">${won(t.budget)}</div></div>
        <div><div class="sub sm">지출</div><div class="num">${won(t.spent)}</div></div>
        <div><div class="sub sm">사용률</div><div class="num" style="color:${COLOR[t.status]}">${t.rateText}</div></div>
      </div>
      <div class="sub sm">소비내역 ${list.length}건</div>
    </div>
    <h3>항목별 예산</h3>
    <div class="card list">${rows.map(budgetRow).join('')}</div>
    <div class="legend">
      <span><i class="dot" style="background:var(--green)"></i>여유 (80% 미만)</span>
      <span><i class="dot" style="background:var(--orange)"></i>주의 (80~100%)</span>
      <span><i class="dot" style="background:var(--red)"></i>초과 (100% 넘음)</span>
      <span>점선 = 100%</span>
    </div>
    <p class="foot">항목을 누르면 예산을 바꿀 수 있어요.</p>
    <h3>메모</h3>
    <div class="card"><textarea id="note" class="note" rows="1">${esc(state.notes[k] || '')}</textarea></div>`;
  autoGrow($('#note'));
}

function renderHistory() {
  if (ui.filter && !state.categories.some(c => c.id === ui.filter)) ui.filter = null;
  let list = expensesIn(ui.period);
  if (ui.filter) list = list.filter(e => e.catId === ui.filter);
  list.sort((a, b) => b.date.localeCompare(a.date) || b.created - a.created);
  const names = Object.fromEntries(state.categories.map(c => [c.id, c.name]));
  const groups = [];
  list.forEach(e => {
    const g = groups[groups.length - 1];
    if (g && g.date === e.date) g.items.push(e); else groups.push({ date: e.date, items: [e] });
  });
  const sum = arr => arr.reduce((a, e) => a + e.amount, 0);
  $('#view-history').innerHTML = `
    <div class="chips">
      <span class="chip ${ui.filter ? '' : 'on'}" data-act="filter" data-id="">전체</span>
      ${state.categories.map(c => `<span class="chip ${ui.filter === c.id ? 'on' : ''}" data-act="filter" data-id="${c.id}">${esc(c.name)}</span>`).join('')}
    </div>
    <div class="row between" style="margin:12px 4px 0"><span class="sub">${list.length}건</span><b class="num">합계 ${won(sum(list))}</b></div>
    ${groups.length ? '' : '<div class="empty">내역이 없어요<div class="sub sm" style="margin-top:4px">오른쪽 아래 + 버튼으로 추가하세요</div></div>'}
    ${groups.map(g => `
      <div class="dayhead"><span>${dayLabel(g.date)}</span><span class="num">${won(sum(g.items))}</span></div>
      <div class="card list">${g.items.map(e => `
        <div class="item exp" data-act="edit" data-id="${e.id}">
          <span class="tag">${esc(names[e.catId] || '-')}</span>
          <span class="memo">${e.memo ? esc(e.memo) : '<span class="sub">(내용 없음)</span>'}</span>
          <span class="amt">${won(e.amount)}</span>
        </div>`).join('')}</div>`).join('')}`;
}

function renderSettings() {
  const k = pkey(ui.period), n = state.categories.length;
  const days = Array.from({ length: 28 }, (_, i) => i + 1);
  $('#view-settings').innerHTML = `
    <h3 style="margin-top:4px">기간</h3>
    <div class="card list"><label class="row between field"><span>한 달 시작일</span>
      <select id="startDay">${days.map(d => `<option value="${d}" ${d === state.startDay ? 'selected' : ''}>${d}일</option>`).join('')}</select></label></div>
    <p class="foot">25일이면 10/25 ~ 11/24가 '11월'이 돼요.</p>
    <h3>항목 (${ui.period.m}월 예산)</h3>
    <div class="card list">
      ${state.categories.map((c, i) => `
        <div class="item row between">
          <span class="cname2">${esc(c.name)} <span class="sub sm num">${won(budgetOf(c, k))}</span></span>
          <span class="tools">
            <button data-act="up" data-id="${c.id}" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button data-act="down" data-id="${c.id}" ${i === n - 1 ? 'disabled' : ''}>▼</button>
            <button data-act="rename" data-id="${c.id}">이름</button>
            <button data-act="delcat" data-id="${c.id}" class="danger">삭제</button>
          </span>
        </div>`).join('')}
      <div class="addrow"><input id="newCat" placeholder="새 항목 이름" enterkeyhint="done"><button class="btn" data-act="addcat">추가</button></div>
    </div>
    <p class="foot">예산은 가계부 탭에서 항목을 눌러 바꿔요.</p>
    <h3>백업</h3>
    <div class="card list">
      <div class="item link" data-act="share">백업 파일 저장·공유</div>
      <div class="item link" data-act="copy">백업 내용 복사</div>
      <div class="item link" data-act="importFile">파일에서 불러오기</div>
      <div class="item link" data-act="importPaste">붙여넣어서 불러오기</div>
      <div class="item link" data-act="csv">엑셀용 CSV 저장·공유</div>
    </div>
    <p class="foot">데이터는 이 아이폰의 이 앱 안에만 저장돼요. 홈 화면 아이콘을 지우면 데이터도 사라질 수 있으니 가끔 백업해 두세요.<br>백업(JSON)을 불러오면 지금 데이터가 백업 내용으로 바뀌고, CSV(날짜,항목,내용,금액)를 불러오면 내역이 추가돼요.</p>
    <h3>초기화</h3>
    <div class="card list"><div class="item danger" data-act="reset">모든 데이터 지우기</div></div>
    <p class="foot" style="margin-bottom:20px">저장된 내역 ${state.expenses.length}건</p>`;
}

/* ---------- 입력 시트 ---------- */
function openSheet(title, body, saveLabel) {
  $('#sheetTitle').textContent = title;
  $('#sheetBody').innerHTML = body;
  $('#sheetSave').textContent = saveLabel || '저장';
  $('#overlay').hidden = false;
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  $('#overlay').hidden = true;
  document.body.style.overflow = '';
  edit = null;
}
function lastCatId() {
  let best = null;
  for (const e of state.expenses) if (!best || e.created > best.created) best = e;
  return best && state.categories.some(c => c.id === best.catId) ? best.catId : null;
}
function suggestions(catId) {
  const counts = {};
  const recent = state.expenses.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 300);
  for (const e of recent) if (e.catId === catId && e.memo) counts[e.memo] = (counts[e.memo] || 0) + 1;
  return Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 8).map(x => x[0]);
}
function renderSugg() {
  const box = $('#fSugg'); if (!box) return;
  const list = edit && edit.catId ? suggestions(edit.catId) : [];
  box.innerHTML = list.map(s => `<span class="chip" data-act="sugg" data-v="${esc(s)}">${esc(s)}</span>`).join('');
}
/* 지출 입력 순서: 날짜 → 항목 → 내용 → 금액 */
function openExpense(id) {
  if (!state.categories.length) { alert('설정에서 항목을 먼저 만들어 주세요.'); return; }
  const e = id ? state.expenses.find(x => x.id === id) : null;
  edit = { kind: 'expense', id: e ? e.id : null, catId: e ? e.catId : lastCatId() };
  openSheet(e ? '지출 수정' : '지출 추가', `
    <label class="lbl">날짜</label>
    <input id="fDate" class="text" type="date" value="${e ? e.date : today()}">
    <label class="lbl">항목</label>
    <div class="chips wrap" id="fCats">${state.categories.map(c => `<span class="chip ${c.id === edit.catId ? 'on' : ''}" data-act="pickCat" data-id="${c.id}">${esc(c.name)}</span>`).join('')}</div>
    <label class="lbl">내용</label>
    <input id="fMemo" class="text" placeholder="예: 점심, 편의점" enterkeyhint="next" autocomplete="off" value="${e ? esc(e.memo) : ''}">
    <div class="chips" id="fSugg" style="margin-top:8px"></div>
    <label class="lbl">금액</label>
    <div class="amount"><input id="fAmount" class="money" inputmode="numeric" enterkeyhint="done" autocomplete="off" placeholder="0" value="${e ? e.amount.toLocaleString('ko-KR') : ''}"><span class="sub">원</span></div>
    ${e ? '<button class="danger-btn" data-act="delExp">이 내역 삭제</button>' : ''}`);
  renderSugg();
}
function openBudget(id) {
  const c = state.categories.find(x => x.id === id); if (!c) return;
  const k = pkey(ui.period);
  edit = { kind: 'budget', id, key: k };
  openSheet('예산 수정', `
    <label class="lbl">${esc(c.name)} 예산</label>
    <div class="amount"><input id="fAmount" class="money" inputmode="numeric" autocomplete="off" placeholder="0" value="${budgetOf(c, k).toLocaleString('ko-KR')}"><span class="sub">원</span></div>
    <p class="foot">${ui.period.m}월부터 적용돼요. 지난달 예산은 바뀌지 않아요.</p>`);
  $('#fAmount').focus();
}
function openPaste() {
  edit = { kind: 'paste' };
  openSheet('붙여넣어서 불러오기', `
    <p class="foot" style="margin-top:4px">백업 내용(JSON)이나 CSV(날짜,항목,내용,금액)를 붙여넣으세요.</p>
    <textarea id="fPaste" class="text" style="margin-top:10px" placeholder="여기를 길게 눌러 붙여넣기"></textarea>`, '불러오기');
}
function sheetSave() {
  if (!edit) return;
  if (edit.kind === 'expense') {
    const amount = toInt($('#fAmount').value);
    if (!edit.catId) { alert('항목을 골라 주세요.'); return; }
    if (!amount) { alert('금액을 입력해 주세요.'); return; }
    const data = { amount, catId: edit.catId, memo: $('#fMemo').value.trim(), date: $('#fDate').value || today() };
    if (edit.id) { const t = state.expenses.find(x => x.id === edit.id); if (t) Object.assign(t, data); }
    else state.expenses.push({ id: uid(), created: Date.now(), ...data });
  } else if (edit.kind === 'budget') {
    const c = state.categories.find(x => x.id === edit.id);
    if (c) c.budgets[edit.key] = toInt($('#fAmount').value);
  } else if (edit.kind === 'paste') {
    const text = $('#fPaste').value;
    closeSheet();
    importText(text);
    return;
  }
  save(); closeSheet(); render();
}

/* ---------- 항목 관리 ---------- */
function moveCat(id, d) {
  const a = state.categories, i = a.findIndex(c => c.id === id), j = i + d;
  if (i < 0 || j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  save(); render();
}
function renameCat(id) {
  const c = state.categories.find(x => x.id === id); if (!c) return;
  const name = (prompt('새 이름', c.name) || '').trim();
  if (!name || name === c.name) return;
  if (state.categories.some(x => x.name === name)) { alert(`'${name}' 항목이 이미 있어요.`); return; }
  c.name = name; save(); render();
}
function deleteCat(id) {
  const c = state.categories.find(x => x.id === id); if (!c) return;
  const n = state.expenses.filter(e => e.catId === id).length;
  if (!confirm(`'${c.name}' 항목과 그 내역 ${n}건을 지울까요?`)) return;
  state.categories = state.categories.filter(x => x.id !== id);
  state.expenses = state.expenses.filter(e => e.catId !== id);
  save(); render();
}
function addCategory() {
  const el = $('#newCat'); if (!el) return;
  const name = el.value.trim(); if (!name) return;
  if (state.categories.some(c => c.name === name)) { alert(`'${name}' 항목이 이미 있어요.`); return; }
  state.categories.push({ id: uid(), name, budgets: {} });
  save(); render();
}

/* ---------- 백업 ---------- */
function csvText() {
  const names = Object.fromEntries(state.categories.map(c => [c.id, c.name]));
  const cell = v => { v = String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = state.expenses.slice().sort((a, b) => a.date.localeCompare(b.date) || a.created - b.created)
    .map(e => [e.date, names[e.catId] || '', e.memo, e.amount].map(cell).join(','));
  return '\uFEFF' + ['날짜,항목,내용,금액', ...lines].join('\r\n');
}
function copyText(text, msg) {
  if (!navigator.clipboard) { alert('복사를 지원하지 않아요.'); return; }
  navigator.clipboard.writeText(text)
    .then(() => alert(msg || "복사했어요. 메모 앱이나 카톡 '나와의 채팅'에 붙여넣어 보관하세요."))
    .catch(() => alert("복사하지 못했어요. '백업 파일 저장·공유'를 써 주세요."));
}
function shareFile(text, name, type) {
  let file = null;
  try { file = new File([text], name, { type }); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).catch(err => { if (err.name !== 'AbortError') alert("공유하지 못했어요. '백업 내용 복사'를 써 주세요."); });
  } else {
    copyText(text, '이 기기에선 파일 공유가 안 돼서 내용을 복사했어요. 메모 앱 등에 붙여넣어 보관하세요.');
  }
}
async function readFileText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('euc-kr').decode(buf); } // 윈도우 엑셀 CSV
}
function parseCSV(text) {
  const rows = []; let row = [], field = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(field); field = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else field += ch;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function parseDate(s) {
  s = String(s || '').trim();
  if (/^\d{5}(\.\d+)?$/.test(s)) { // 엑셀 날짜 숫자 (46320 = 2026-10-25)
    const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000);
    return ymd(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const m = s.match(/^(\d{4})\s*[-./년]\s*(\d{1,2})\s*[-./월]\s*(\d{1,2})/);
  if (m && +m[2] >= 1 && +m[2] <= 12 && +m[3] >= 1 && +m[3] <= 31) return ymd(+m[1], +m[2], +m[3]);
  return null;
}
function importCSV(text) {
  let n = 0;
  parseCSV(text).forEach((r, i) => {
    if (r.length < 4) return;
    const date = parseDate(r[0]), amount = toInt(r[3]), name = (r[1] || '').trim();
    if (!date || !amount || !name) return; // 머리글 행은 여기서 걸러짐
    let c = state.categories.find(x => x.name === name);
    if (!c) { c = { id: uid(), name, budgets: {} }; state.categories.push(c); }
    state.expenses.push({ id: uid(), date, catId: c.id, memo: (r[2] || '').trim(), amount, created: Date.now() + i });
    n++;
  });
  if (n) save();
  return n;
}
function importText(text) {
  text = String(text || '').replace(/^\uFEFF/, '').trim();
  if (!text) return;
  if (text[0] === '{') {
    let obj;
    try { obj = JSON.parse(text); } catch (e) { alert('백업 내용을 읽지 못했어요. 처음부터 끝까지 빠짐없이 붙여넣었는지 확인해 주세요.'); return; }
    if (!obj || !Array.isArray(obj.categories)) { alert('가계부 백업 형식이 아니에요.'); return; }
    const next = normalize(obj);
    if (!confirm(`지금 데이터를 이 백업(항목 ${next.categories.length}개, 내역 ${next.expenses.length}건)으로 바꿀까요?`)) return;
    state = next; save();
    ui = { tab: 'budget', period: periodOf(today(), state.startDay), filter: null };
    render(); alert('불러왔어요.');
    return;
  }
  const n = importCSV(text);
  render();
  alert(n ? `${n}건을 추가했어요.` : '가져올 내역이 없어요. 형식(날짜,항목,내용,금액)을 확인해 주세요.');
}

/* ---------- 이벤트 ---------- */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'tab': ui.tab = el.dataset.tab; window.scrollTo(0, 0); render(); break;
    case 'prev': ui.period = shift(ui.period, -1); render(); break;
    case 'next': ui.period = shift(ui.period, 1); render(); break;
    case 'today': ui.period = periodOf(today(), state.startDay); render(); break;
    case 'add': openExpense(null); break;
    case 'edit': openExpense(id); break;
    case 'budget': openBudget(id); break;
    case 'filter': ui.filter = id || null; render(); break;
    case 'pickCat':
      if (!edit) break;
      edit.catId = id;
      document.querySelectorAll('#fCats .chip').forEach(c => c.classList.toggle('on', c.dataset.id === id));
      renderSugg(); break;
    case 'sugg': $('#fMemo').value = el.dataset.v; $('#fAmount').focus(); break;
    case 'close': closeSheet(); break;
    case 'sheetSave': sheetSave(); break;
    case 'delExp':
      if (edit && edit.id && confirm('이 내역을 삭제할까요?')) {
        state.expenses = state.expenses.filter(x => x.id !== edit.id);
        save(); closeSheet(); render();
      }
      break;
    case 'up': moveCat(id, -1); break;
    case 'down': moveCat(id, 1); break;
    case 'rename': renameCat(id); break;
    case 'delcat': deleteCat(id); break;
    case 'addcat': addCategory(); break;
    case 'share': shareFile(JSON.stringify({ app: 'gagyebu', ...state }), `가계부백업_${today()}.json`, 'application/json'); break;
    case 'copy': copyText(JSON.stringify({ app: 'gagyebu', ...state })); break;
    case 'importFile': $('#fileInput').click(); break;
    case 'importPaste': openPaste(); break;
    case 'csv': shareFile(csvText(), `가계부_${today()}.csv`, 'text/csv'); break;
    case 'reset':
      if (confirm('정말 모든 데이터를 지울까요? 되돌릴 수 없어요.') && confirm('백업은 해두셨나요? 정말 지울까요?')) {
        state = fresh(); save();
        ui = { tab: 'budget', period: periodOf(today(), state.startDay), filter: null };
        render();
      }
      break;
  }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (t.id === 'note') {
    const k = pkey(ui.period);
    if (t.value) state.notes[k] = t.value; else delete state.notes[k];
    save(); autoGrow(t);
  } else if (t.classList.contains('money')) {
    const d = t.value.replace(/\D/g, '').slice(0, 12);
    t.value = d ? Number(d).toLocaleString('ko-KR') : '';
  }
});
document.addEventListener('change', ev => {
  if (ev.target.id === 'startDay') {
    state.startDay = clampDay(ev.target.value); save();
    ui.period = periodOf(today(), state.startDay); render();
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter' || ev.isComposing || ev.target.tagName !== 'INPUT') return;
  if (ev.target.id === 'newCat') addCategory();
  else if (ev.target.id === 'fMemo') $('#fAmount').focus(); // 내용 다음은 금액
  else ev.target.blur();
});
$('#overlay').addEventListener('click', ev => { if (ev.target.id === 'overlay') closeSheet(); });
$('#fileInput').addEventListener('change', async ev => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f) return;
  try { importText(await readFileText(f)); } catch (e) { alert('파일을 읽지 못했어요.'); }
});

/* ---------- 시작 ---------- */
(function makeIcon() { // 홈 화면 아이콘: 흰 바탕 + 초록 ₩
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 180, 180);
    const grd = g.createLinearGradient(0, 0, 180, 180);
    grd.addColorStop(0, '#34c759'); grd.addColorStop(1, '#0a8f45');
    g.fillStyle = grd; g.font = 'bold 100px -apple-system, sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('₩', 90, 96);
    const link = document.createElement('link'); link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
    document.head.appendChild(link);
  } catch (e) {}
})();
const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
if (!standalone) $('#install').hidden = false;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
render();
</script>
</body>
</html>
